name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Vite and Compile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Sync Capacitor (generates cordova plugins & web assets)
        run: npx cap sync android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Fix gradlew line endings and permissions
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Accept Android Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GetGo-Ride-Mobile-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
